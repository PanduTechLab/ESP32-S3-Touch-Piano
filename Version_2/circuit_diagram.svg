  <circle cx="30" cy="96" r="3" fill="#DC2626"/>
  <line x1="12" y1="112" x2="50" y2="112" stroke="#1F2937" stroke-width="2"/>
  <circle cx="12" cy="112" r="3" fill="#1F2937"/>
  <line x1="230" y1="104" x2="380" y2="104" stroke="#7C3AED" stroke-width="2.5"/>
  <circle cx="230" cy="104" r="3.5" fill="#7C3AED"/>
  <circle cx="380" cy="104" r="3.5" fill="#7C3AED"/>

