  <text x="392" y="167" font-size="11" fill="#312E81" font-weight="bold" font-family="Arial, sans-serif">GPIO 15 (Key 1)</text>
  <text x="392" y="223" font-size="11" fill="#312E81" font-weight="bold" font-family="Arial, sans-serif">GPIO 16 (Key 2)</text>
  <text x="392" y="279" font-size="11" fill="#312E81" font-weight="bold" font-family="Arial, sans-serif">GPIO 17 (Key 3)</text>
  <text x="392" y="335" font-size="11" fill="#312E81" font-weight="bold" font-family="Arial, sans-serif">GPIO 18 (Key 4)</text>
  <text x="392" y="391" font-size="11" fill="#312E81" font-weight="bold" font-family="Arial, sans-serif">GPIO 8  (Key 5)</text>
  <text x="392" y="447" font-size="11" fill="#312E81" font-weight="bold" font-family="Arial, sans-serif">GPIO 9  (Key 6)</text>
  <text x="392" y="503" font-size="11" fill="#312E81" font-weight="bold" font-family="Arial, sans-serif">GPIO 10 (Key 7)</text>
  <text x="392" y="559" font-size="11" fill="#312E81" font-weight="bold" font-family="Arial, sans-serif">GPIO 11 (Key 8)</text>

  <text x="392" y="630" font-size="11" fill="#DC2626" font-weight="bold" font-family="Arial, sans-serif">3V3 Output</text>
