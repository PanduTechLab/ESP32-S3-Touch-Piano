  <text x="140" y="344" font-size="10" text-anchor="middle" fill="#047857" font-family="Arial, sans-serif">Perfect 4th</text>
  <line x1="30" y1="323" x2="50" y2="323" stroke="#DC2626" stroke-width="2"/>
  <circle cx="30" cy="323" r="3" fill="#DC2626"/>
  <line x1="12" y1="337" x2="50" y2="337" stroke="#1F2937" stroke-width="2"/>
  <circle cx="12" cy="337" r="3" fill="#1F2937"/>
  <line x1="230" y1="331" x2="380" y2="331" stroke="#0D9488" stroke-width="2"/>
  <circle cx="230" cy="331" r="3" fill="#0D9488"/>
  <circle cx="380" cy="331" r="3" fill="#0D9488"/>

  <!-- Key 5: Note G (GPIO 8) -->
  <rect x="50" y="366" width="180" height="42" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
