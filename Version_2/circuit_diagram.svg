  <text x="140" y="288" font-size="10" text-anchor="middle" fill="#047857" font-family="Arial, sans-serif">Major 3rd</text>
  <line x1="30" y1="267" x2="50" y2="267" stroke="#DC2626" stroke-width="2"/>
  <circle cx="30" cy="267" r="3" fill="#DC2626"/>
  <line x1="12" y1="281" x2="50" y2="281" stroke="#1F2937" stroke-width="2"/>
