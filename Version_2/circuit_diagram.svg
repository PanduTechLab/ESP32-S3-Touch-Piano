  <line x1="230" y1="443" x2="380" y2="443" stroke="#0D9488" stroke-width="2"/>
  <circle cx="230" cy="443" r="3" fill="#0D9488"/>
  <circle cx="380" cy="443" r="3" fill="#0D9488"/>

  <!-- Key 7: Note B (GPIO 10) -->
  <rect x="50" y="478" width="180" height="42" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
