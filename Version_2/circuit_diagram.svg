  <text x="568" y="320" font-size="12" text-anchor="end" fill="#312E81" font-weight="bold" font-family="Arial, sans-serif">GPIO 6 (DIN)</text>
  <circle cx="580" cy="316" r="3.5" fill="#4F46E5"/>

  <text x="568" y="375" font-size="12" text-anchor="end" fill="#DC2626" font-weight="bold" font-family="Arial, sans-serif">5V (VBUS)</text>
