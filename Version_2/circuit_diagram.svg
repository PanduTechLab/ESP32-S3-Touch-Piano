<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="710" viewBox="0 0 1120 710">
  <rect x="2" y="2" width="1116" height="706" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <text x="560" y="30" font-size="20" text-anchor="middle" fill="#111827" font-weight="bold" font-family="Arial, Helvetica, sans-serif">ESP32-S3 Touch Piano - Mode 2 Circuit Diagram (All-in-One Octaves)</text>
  <text x="560" y="50" font-size="12" text-anchor="middle" fill="#4B5563" font-family="Arial, Helvetica, sans-serif">Dedicated Octave Switch (GPIO 7) + 8 Piano Keys (GPIO 15-11) + MAX98357A I2S Amplifier</text>

  <!-- Power Bus Rails -->
  <line x1="30" y1="75" x2="30" y2="640" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
  <text x="32" y="70" font-size="11" text-anchor="middle" fill="#DC2626" font-weight="bold" font-family="Arial, sans-serif">3V3</text>

  <line x1="12" y1="90" x2="12" y2="660" stroke="#1F2937" stroke-width="2.5" stroke-linecap="round"/>
  <text x="12" y="70" font-size="11" text-anchor="middle" fill="#1F2937" font-weight="bold" font-family="Arial, sans-serif">GND</text>

