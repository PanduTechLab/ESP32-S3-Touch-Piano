  <text x="140" y="161" font-size="12" text-anchor="middle" fill="#065F46" font-weight="bold" font-family="Arial, sans-serif">TTP223 - Key 1: Note C</text>
  <text x="140" y="176" font-size="10" text-anchor="middle" fill="#047857" font-family="Arial, sans-serif">Root Tonic</text>
  <line x1="30" y1="155" x2="50" y2="155" stroke="#DC2626" stroke-width="2"/>
  <circle cx="30" cy="155" r="3" fill="#DC2626"/>
  <line x1="12" y1="169" x2="50" y2="169" stroke="#1F2937" stroke-width="2"/>
  <circle cx="12" cy="169" r="3" fill="#1F2937"/>
  <line x1="230" y1="163" x2="380" y2="163" stroke="#0D9488" stroke-width="2"/>
  <circle cx="230" cy="163" r="3" fill="#0D9488"/>
  <circle cx="380" cy="163" r="3" fill="#0D9488"/>

