  <rect x="50" y="534" width="180" height="42" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="140" y="553" font-size="12" text-anchor="middle" fill="#065F46" font-weight="bold" font-family="Arial, sans-serif">TTP223 - Key 8: High C</text>
  <text x="140" y="568" font-size="10" text-anchor="middle" fill="#047857" font-family="Arial, sans-serif">Octave Tonic (8th)</text>
