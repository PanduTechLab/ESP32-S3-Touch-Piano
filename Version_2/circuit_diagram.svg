  <circle cx="30" cy="211" r="3" fill="#DC2626"/>
  <line x1="12" y1="225" x2="50" y2="225" stroke="#1F2937" stroke-width="2"/>
  <circle cx="12" cy="225" r="3" fill="#1F2937"/>
  <line x1="230" y1="219" x2="380" y2="219" stroke="#0D9488" stroke-width="2"/>
  <circle cx="230" cy="219" r="3" fill="#0D9488"/>
  <circle cx="380" cy="219" r="3" fill="#0D9488"/>

