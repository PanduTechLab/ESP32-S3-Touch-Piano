  <circle cx="30" cy="626" r="3" fill="#DC2626"/>
  <circle cx="380" cy="626" r="3" fill="#DC2626"/>

  <text x="392" y="660" font-size="11" fill="#1F2937" font-weight="bold" font-family="Arial, sans-serif">GND</text>
