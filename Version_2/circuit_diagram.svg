  <line x1="230" y1="275" x2="380" y2="275" stroke="#0D9488" stroke-width="2"/>
  <circle cx="230" cy="275" r="3" fill="#0D9488"/>
  <circle cx="380" cy="275" r="3" fill="#0D9488"/>

