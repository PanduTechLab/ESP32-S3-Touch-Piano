  <text x="140" y="512" font-size="10" text-anchor="middle" fill="#047857" font-family="Arial, sans-serif">Major 7th</text>
  <line x1="30" y1="491" x2="50" y2="491" stroke="#DC2626" stroke-width="2"/>
  <circle cx="30" cy="491" r="3" fill="#DC2626"/>
  <line x1="12" y1="505" x2="50" y2="505" stroke="#1F2937" stroke-width="2"/>
