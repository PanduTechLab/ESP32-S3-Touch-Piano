<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#4B5563" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="976" height="416" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
  <text x="490" y="30" font-size="18" text-anchor="middle" fill="#111827" font-weight="bold" font-family="Arial, sans-serif">ESP32-S3 Touch Piano - Mode 2 System Architecture Block Diagram</text>
  <text x="490" y="48" font-size="12" text-anchor="middle" fill="#4B5563" font-family="Arial, sans-serif">All-in-One 7-Octave Firmware with Touch Octave Selector (GPIO 7) &amp; 8 Playable Keys</text>

  <!-- 1. Input Stage: Touch Sensors -->
  <!-- Octave Selector Sensor -->
  <rect x="20" y="75" width="160" height="90" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="100" y="98" font-size="13" text-anchor="middle" fill="#5B21B6" font-weight="bold" font-family="Arial, sans-serif">TTP223 Sensor</text>
  <text x="100" y="116" font-size="11" text-anchor="middle" fill="#6D28D9" font-weight="bold" font-family="Arial, sans-serif">OCTAVE SELECTOR</text>
  <text x="100" y="134" font-size="10" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif">Tap to cycle: 1 &#8594; 7 &#8594; 1</text>
  <text x="100" y="152" font-size="10" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif">GPIO 7 (Digital Pulse)</text>

  <!-- 8 Piano Keys -->
  <rect x="20" y="185" width="160" height="215" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="100" y="212" font-size="14" text-anchor="middle" fill="#065F46" font-weight="bold" font-family="Arial, sans-serif">8 x TTP223 Sensors</text>
  <text x="100" y="230" font-size="11" text-anchor="middle" fill="#047857" font-family="Arial, sans-serif">Piano Keys (8 Notes)</text>
  <line x1="35" y1="242" x2="165" y2="242" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="100" y="262" font-size="10" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif">Key 1: Note C</text>
  <text x="100" y="280" font-size="10" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif">Key 2-7: D, E, F, G, A, B</text>
  <text x="100" y="298" font-size="10" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif">Key 8: High C</text>
  <text x="100" y="340" font-size="10" text-anchor="middle" fill="#059669" font-weight="bold" font-family="Arial, sans-serif">GPIO 15, 16, 17, 18,</text>
  <text x="100" y="358" font-size="10" text-anchor="middle" fill="#059669" font-weight="bold" font-family="Arial, sans-serif">8, 9, 10, 11</text>

  <!-- Arrow: Octave Sensor -> ESP32 -->
  <line x1="180" y1="120" x2="225" y2="120" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="202" y="112" font-size="9" text-anchor="middle" fill="#7C3AED" font-weight="bold" font-family="Arial, sans-serif">GPIO 7</text>

  <!-- Arrow: Keys -> ESP32 -->
  <line x1="180" y1="290" x2="225" y2="290" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="202" y="280" font-size="9" text-anchor="middle" fill="#059669" font-weight="bold" font-family="Arial, sans-serif">GPIO</text>

  <!-- 2. ESP32-S3 Microcontroller Core Container -->
  <rect x="230" y="70" width="415" height="330" rx="10" fill="#F5F3FF" stroke="#6D28D9" stroke-width="2"/>
  <text x="437" y="93" font-size="15" text-anchor="middle" fill="#4C1D95" font-weight="bold" font-family="Arial, sans-serif">ESP32-S3 Firmware &amp; DSP Audio Architecture</text>

  <!-- Module 1: Octave Tap State Machine -->
  <rect x="245" y="105" width="175" height="75" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="332" y="126" font-size="12" text-anchor="middle" fill="#5B21B6" font-weight="bold" font-family="Arial, sans-serif">Octave Tap FSM</text>
  <text x="332" y="144" font-size="10" text-anchor="middle" fill="#6D28D9" font-family="Arial, sans-serif">Edge Detection &amp; Debounce</text>
  <text x="332" y="161" font-size="9" text-anchor="middle" fill="#7C3AED" font-weight="bold" font-family="Arial, sans-serif">Cycles: Oct 1 &#8594; 7 &#8594; 1</text>

  <!-- Module 2: Octave Frequency & Harmonic Profiles Database -->
  <rect x="445" y="105" width="185" height="75" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="537" y="126" font-size="12" text-anchor="middle" fill="#5B21B6" font-weight="bold" font-family="Arial, sans-serif">7-Octave Profile DB</text>
  <text x="537" y="144" font-size="10" text-anchor="middle" fill="#6D28D9" font-family="Arial, sans-serif">Pre-tuned Frequencies (C1-C8)</text>
  <text x="537" y="161" font-size="9" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif">Dynamic Vol &amp; H2 Balancing</text>

  <line x1="420" y1="142" x2="442" y2="142" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Module 3: Key Debounce Engine -->
  <rect x="245" y="200" width="175" height="80" rx="6" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="332" y="224" font-size="12" text-anchor="middle" fill="#5B21B6" font-weight="bold" font-family="Arial, sans-serif">Key Debounce Engine</text>
  <text x="332" y="242" font-size="10" text-anchor="middle" fill="#6D28D9" font-family="Arial, sans-serif">4-Block Stability Filter</text>
  <text x="332" y="258" font-size="9" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif">Polyphonic State Tracker</text>

  <!-- Module 4: ADSR Envelope Generator -->
  <rect x="245" y="295" width="175" height="85" rx="6" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="332" y="318" font-size="12" text-anchor="middle" fill="#5B21B6" font-weight="bold" font-family="Arial, sans-serif">Smooth ADSR</text>
  <text x="332" y="336" font-size="10" text-anchor="middle" fill="#6D28D9" font-family="Arial, sans-serif">Attack (4ms) &amp; Decay (1.2s)</text>
  <text x="332" y="352" font-size="10" text-anchor="middle" fill="#6D28D9" font-family="Arial, sans-serif">Release (60ms) Smooth Fade</text>
  <text x="332" y="368" font-size="9" text-anchor="middle" fill="#10B981" font-weight="bold" font-family="Arial, sans-serif">Zero Clicking / Pops</text>

  <line x1="332" y1="280" x2="332" y2="292" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Module 5: Polyphonic Additive Sine Synthesis -->
  <rect x="445" y="200" width="185" height="95" rx="6" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="537" y="222" font-size="12" text-anchor="middle" fill="#5B21B6" font-weight="bold" font-family="Arial, sans-serif">8-Voice Poly Synth</text>
  <text x="537" y="240" font-size="10" text-anchor="middle" fill="#6D28D9" font-family="Arial, sans-serif">1024-pt Sine LUT + Lerp</text>
  <text x="537" y="256" font-size="10" text-anchor="middle" fill="#6D28D9" font-family="Arial, sans-serif">Dynamic Harmonic H2 Gen</text>
  <text x="537" y="274" font-size="9" text-anchor="middle" fill="#7C3AED" font-weight="bold" font-family="Arial, sans-serif">On-the-fly PhaseInc Update</text>

  <!-- Connect Profile DB to Poly Synth -->
  <line x1="537" y1="180" x2="537" y2="198" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Module 6: Soft Limiter & I2S Output -->
  <rect x="445" y="310" width="185" height="70" rx="6" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="537" y="332" font-size="12" text-anchor="middle" fill="#5B21B6" font-weight="bold" font-family="Arial, sans-serif">Soft Limiter &amp; I2S</text>
  <text x="537" y="349" font-size="10" text-anchor="middle" fill="#6D28D9" font-family="Arial, sans-serif">tanhf() Gentle Soft Clipper</text>
  <text x="537" y="365" font-size="9" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif">44.1 kHz 16-Bit Stereo</text>

  <line x1="420" y1="337" x2="442" y2="337" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="537" y1="295" x2="537" y2="307" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow: ESP32 -> MAX98357A -->
  <line x1="645" y1="345" x2="685" y2="345" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="665" y="335" font-size="10" text-anchor="middle" fill="#D97706" font-weight="bold" font-family="Arial, sans-serif">I2S Bus</text>

  <!-- 3. MAX98357A DAC & Amplifier -->
  <rect x="690" y="265" width="135" height="135" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.8"/>
  <text x="757" y="295" font-size="14" text-anchor="middle" fill="#9A3412" font-weight="bold" font-family="Arial, sans-serif">MAX98357A</text>
  <text x="757" y="315" font-size="11" text-anchor="middle" fill="#C2410C" font-family="Arial, sans-serif">I2S DAC + Amp</text>
  <line x1="705" y1="327" x2="810" y2="327" stroke="#FFEDD5" stroke-width="1.5"/>
  <text x="757" y="347" font-size="10" text-anchor="middle" fill="#9A3412" font-family="Arial, sans-serif">Class-D Output</text>
  <text x="757" y="363" font-size="10" text-anchor="middle" fill="#9A3412" font-family="Arial, sans-serif">12 dB Gain (GND)</text>
  <text x="757" y="380" font-size="9" text-anchor="middle" fill="#16A34A" font-weight="bold" font-family="Arial, sans-serif">3.2W Peak Power</text>

  <!-- Arrow: MAX98357A -> Speaker -->
  <line x1="825" y1="332" x2="860" y2="332" stroke="#1F2937" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="842" y="322" font-size="9" text-anchor="middle" fill="#374151" font-weight="bold" font-family="Arial, sans-serif">SPK+/-</text>

  <!-- 4. Speaker -->
  <rect x="865" y="280" width="95" height="105" rx="8" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.8"/>
  <text x="912" y="320" font-size="14" text-anchor="middle" fill="#111827" font-weight="bold" font-family="Arial, sans-serif">Speaker</text>
  <text x="912" y="340" font-size="11" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif">4 &#937; / 3W-4W</text>
  <text x="912" y="358" font-size="9" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif">(CS 69 4W)</text>
</svg>
